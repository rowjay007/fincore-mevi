name: Master CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Prevent overlapping runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pipeline:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Verify Dependencies
      run: go mod verify

    - name: Static Analysis
      run: |
        go vet ./...
        # Install staticcheck if not cached
        if ! command -v staticcheck &> /dev/null; then
          go install honnef.co/go/tools/cmd/staticcheck@latest
        fi
        $(go env GOPATH)/bin/staticcheck ./...

    - name: Build All Services
      run: go build ./...

    - name: Run All Tests
      run: |
        # Run tests for all packages, but only collect coverage for non-cmd packages to avoid covdata errors
        go test -v -race $(go list ./... | grep -v "/cmd/") -coverprofile=coverage.txt -covermode=atomic
        # Run cmd tests separately without coverage if any exist
        go test -v -race $(go list ./... | grep "/cmd/") || true

    - name: Check Coverage
      run: |
        if [ -f coverage.txt ]; then
          go tool cover -func=coverage.txt | grep total | awk '{print $3}'
        else
          echo "No coverage file generated"
        fi
