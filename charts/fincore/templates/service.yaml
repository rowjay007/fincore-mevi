{{- $root := . -}}
{{- range $svcName, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fincore.serviceName" (dict "root" $root "svcName" $svcName) }}
  labels:
    app.kubernetes.io/name: {{ include "fincore.name" $root }}
    app.kubernetes.io/component: {{ $svcName }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "fincore.name" $root }}
    app.kubernetes.io/component: {{ $svcName }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
{{- end }}
{{- end }}
