apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fincore-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rowjay007/fincore-mevi.git
    targetRevision: HEAD
    path: charts/fincore
    helm:
      valueFiles:
        - values.yaml
        - ../../infra/gitops/overlays/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: fincore-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
