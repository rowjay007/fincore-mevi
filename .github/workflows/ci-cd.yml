name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Formating Check
        run: test -z "$(gofmt -l .)"

      - name: Static Analysis
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race ./...

      - name: Coverage Gate
        env:
          MIN_COVERAGE: 70
        run: |
          go test ./pkg/security/... ./services/auth-service/infrastructure/grpc/... -coverprofile=coverage.out
          pct=$(go tool cover -func=coverage.out | awk '/total:/ {gsub(/%/,"",$3); print $3}')
          echo "coverage=${pct}% (min ${MIN_COVERAGE}%)"
          awk -v p="$pct" -v min="$MIN_COVERAGE" 'BEGIN { exit (p+0 < min+0) }'

  docker-build:
    name: Build Docker Images
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [account-service, ledger-service, auth-service, identity-service, payment-service, audit-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (mock)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/docker/Dockerfile.service
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: false # Set to true and add login steps for real registry
          tags: fincore/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
