name: images

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
    paths:
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "proto/**"
      - "pkg/**"
      - "services/**"
      - "helm/**"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "proto/**"
      - "pkg/**"
      - "services/**"
      - "helm/**"
      - ".github/workflows/images.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          base_sha=""
          head_sha=""
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          echo "diff: ${base_sha}..${head_sha}"

          changed_files=$(git diff --name-only "${base_sha}" "${head_sha}" || true)
          echo "changed_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changed_files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          all_services='[
            {"name":"account-service","pkg":"./services/account-service/cmd/account-service","bin":"account-service","port":8080},
            {"name":"payment-service","pkg":"./services/payment-service/cmd/payment-service","bin":"payment-service","port":8085},
            {"name":"api-gateway","pkg":"./services/api-gateway/cmd/api-gateway","bin":"api-gateway","port":8080},
            {"name":"auth-service","pkg":"./services/auth-service/cmd/auth-service","bin":"auth-service","port":8082},
            {"name":"identity-service","pkg":"./services/identity-service/cmd/identity-service","bin":"identity-service","port":8084},
            {"name":"ledger-service","pkg":"./services/ledger-service/cmd/ledger-service","bin":"ledger-service","port":8083}
          ]'

          # If shared build inputs changed, build everything.
          if echo "$changed_files" | grep -Eq '^(Dockerfile|go\.mod|go\.sum|proto/|pkg/|helm/)'; then
            echo "services=${all_services}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          services=()
          if echo "$changed_files" | grep -Eq '^services/account-service/'; then services+=("account-service"); fi
          if echo "$changed_files" | grep -Eq '^services/payment-service/'; then services+=("payment-service"); fi
          if echo "$changed_files" | grep -Eq '^services/api-gateway/'; then services+=("api-gateway"); fi
          if echo "$changed_files" | grep -Eq '^services/auth-service/'; then services+=("auth-service"); fi
          if echo "$changed_files" | grep -Eq '^services/identity-service/'; then services+=("identity-service"); fi
          if echo "$changed_files" | grep -Eq '^services/ledger-service/'; then services+=("ledger-service"); fi

          if [[ ${#services[@]} -eq 0 ]]; then
            echo 'services=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -s .)
          filtered=$(echo "${all_services}" | jq -c --argjson names "${json}" '[ .[] | select(.name as $n | $names | index($n)) ]')
          echo "services=${filtered}" >> "$GITHUB_OUTPUT"

  build-push:
    needs: [plan]
    if: needs.plan.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.plan.outputs.services) }}

    steps:
      - uses: actions/checkout@v5

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: login to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build (and push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_PKG=${{ matrix.service.pkg }}
            BIN_NAME=${{ matrix.service.bin }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
