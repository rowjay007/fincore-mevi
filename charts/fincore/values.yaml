image:
  registry: ghcr.io
  repository: rowjay007/fincore-mevi
  tag: latest
  pullPolicy: IfNotPresent

services:
  api-gateway:
    enabled: true
    port: 8080
    env: {}
    readinessPath: /healthz
    envFrom:
      configMapName: ""
      secretName: ""
    config:
      enabled: false
      data: {}
  identity-service:
    enabled: true
    port: 8084
    env: {}
    readinessPath: /readyz
    envFrom:
      configMapName: ""
      secretName: ""
    config:
      enabled: false
      data: {}
  auth-service:
    enabled: true
    port: 8082
    env: {}
    readinessPath: /readyz
    envFrom:
      configMapName: ""
      secretName: ""
    config:
      enabled: false
      data: {}
  account-service:
    enabled: true
    port: 8080
    env: {}
    readinessPath: /readyz
    envFrom:
      configMapName: ""
      secretName: ""
    config:
      enabled: false
      data: {}
  ledger-service:
    enabled: true
    port: 8083
    env: {}
    readinessPath: /readyz
    envFrom:
      configMapName: ""
      secretName: ""
    config:
      enabled: false
      data: {}

replicaCount: 1

resources: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: fincore.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

