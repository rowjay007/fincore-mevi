server {
  bind_address = "0.0.0.0"
  bind_port = "8080"
  trust_domain = "fincore.local"
  data_dir = "/run/spire/data"
  log_level = "INFO"
}

health_checks {
  listener_enabled = true
  bind_address = "0.0.0.0"
  bind_port = "8081"
  live_path = "/live"
  ready_path = "/ready"
}

authority {
  type = "disk"
  plugin_data {
    key_file_path  = "/run/spire/data/keys/server.key"
    cert_file_path = "/run/spire/data/keys/server.crt"
  }
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/run/spire/data/datastore.sqlite3"
    }
  }

  NodeAttestor "join_token" {
    plugin_data {}
  }

  KeyManager "disk" {
    plugin_data {
      keys_path = "/run/spire/data/keys"
    }
  }

  UpstreamAuthority "disk" {
    plugin_data {
      key_file_path  = "/run/spire/data/keys/upstream.key"
      cert_file_path = "/run/spire/data/keys/upstream.crt"
    }
  }
}
