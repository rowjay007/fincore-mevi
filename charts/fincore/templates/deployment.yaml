{{- $root := . -}}
{{- range $svcName, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fincore.serviceName" (dict "root" $root "svcName" $svcName) }}
  labels:
    app.kubernetes.io/name: {{ include "fincore.name" $root }}
    app.kubernetes.io/component: {{ $svcName }}
spec:
  replicas: {{ $root.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fincore.name" $root }}
      app.kubernetes.io/component: {{ $svcName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "fincore.name" $root }}
        app.kubernetes.io/component: {{ $svcName }}
    spec:
      containers:
        - name: {{ $svcName }}
          image: {{ include "fincore.image" (dict "root" $root "svcName" $svcName) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          {{- if or $svc.config.enabled $svc.envFrom.configMapName $svc.envFrom.secretName }}
          envFrom:
            {{- if or $svc.config.enabled $svc.envFrom.configMapName }}
            - configMapRef:
                name: {{ default (include "fincore.configMapName" (dict "root" $root "svcName" $svcName)) $svc.envFrom.configMapName | quote }}
            {{- end }}
            {{- if $svc.envFrom.secretName }}
            - secretRef:
                name: {{ $svc.envFrom.secretName | quote }}
            {{- end }}
          {{- end }}
          {{- if $svc.env }}
          env:
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
{{- end }}
{{- end }}
