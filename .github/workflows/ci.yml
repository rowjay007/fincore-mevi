name: Master CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Prevent overlapping runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: false

jobs:
  pipeline:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Verify Dependencies
      run: go mod verify

    - name: Static Analysis
      run: |
        go vet ./...
        if ! command -v staticcheck &> /dev/null; then
          go install honnef.co/go/tools/cmd/staticcheck@latest
        fi
        $(go env GOPATH)/bin/staticcheck ./...

    - name: Build All Services
      run: go build ./...

    - name: Run All Tests
      run: |
        # Only run coverage on packages that actually have _test.go files to avoid covdata errors
        COVERABLE_PKGS=$(find . -name "*_test.go" -exec dirname {} + | sort -u | sed 's|^\./|fincore/|' | grep -v "/cmd/" | grep -v "/gen/" | tr '\n' ' ')
        
        echo "Collecting coverage for verified testable packages..."
        if [ -n "$COVERABLE_PKGS" ]; then
          go test -v -race $COVERABLE_PKGS -coverprofile=coverage.txt -covermode=atomic
        fi
        
        echo "Testing entire codebase for correctness (no coverage)..."
        go test -v -race ./...

    - name: Check Coverage
      run: |
        if [ -f coverage.txt ]; then
          go tool cover -func=coverage.txt | grep total | awk '{print $3}'
        else
          echo "No coverage file generated - this is expected if no matching packages were found"
        fi
