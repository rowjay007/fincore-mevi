name: build

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
    paths:
      - "go.mod"
      - "go.sum"
      - "proto/**"
      - "pkg/**"
      - "services/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "proto/**"
      - "pkg/**"
      - "services/**"
      - ".github/workflows/build.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: account-service
            pkg: ./services/account-service/cmd/account-service
            bin: account-service
          - name: payment-service
            pkg: ./services/payment-service/cmd/payment-service
            bin: payment-service
          - name: api-gateway
            pkg: ./services/api-gateway/cmd/api-gateway
            bin: api-gateway
          - name: auth-service
            pkg: ./services/auth-service/cmd/auth-service
            bin: auth-service
          - name: identity-service
            pkg: ./services/identity-service/cmd/identity-service
            bin: identity-service
          - name: ledger-service
            pkg: ./services/ledger-service/cmd/ledger-service
            bin: ledger-service

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build (${{ matrix.service.name }})
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/${{ matrix.service.bin }}" "${{ matrix.service.pkg }}"
          dist/${{ matrix.service.bin }} --help >/dev/null 2>&1 || true

      - name: upload artifact (${{ matrix.service.name }})
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.service.bin }}-${{ github.sha }}
          path: dist/${{ matrix.service.bin }}
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: prepare release assets
        run: |
          set -eu
          mkdir -p release
          find dist -type f -maxdepth 2 -mindepth 2 -print0 | while IFS= read -r -d '' f; do
            bn=$(basename "$f")
            cp "$f" "release/${bn}"
          done

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
